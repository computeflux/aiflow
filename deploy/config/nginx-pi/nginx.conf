# nginx-pi：pi-web TLS 终结（deploy/compose/core/nginx-pi.yml）
# 参考迁移前的宿主配置 hacks/nginx/pi-web.conf（nginx 用户模式 + DigiCert 证书）。
#
# 证书：token 节点 DigiCert DV（CN/SAN = xiaobai.asyou.me / www.xiaobai.asyou.me），
# 经 bind mount 注入 /etc/nginx/certs/；到期 2026-10-26，续期后替换 /srv/token_node0/.../ssl/ 文件即可（无需改配置）。
#
# 关键坑（照抄自旧配置）：
# 1. Host 必须用 $http_host（保留客户端原始 Host 含 :8443 端口）。pi-web 的
#    isProxyRewrittenSameOrigin 用 normalizeAuthority(保留端口) 比较 Origin authority 与 Host；
#    $host 会去掉端口导致端口不匹配 -> 403。
# 2. pi-web 用 SSE 事件流（非 WebSocket），透传标准反代头即可，无需 upgrade 头。
# 访问域名：https://xiaobai.asyou.me:8443/（与迁移前宿主 nginx 行为一致，见 hacks/nginx/pi-web.conf）；
# IP 直连会证书不匹配警告（旧行为同样如此）。
#
# 上游（2026-10-27）：pi-web 改宿主运行（systemd 用户单元 pi-web.service，:30141）。
# nginx 的 resolver 是 Docker 内嵌 DNS（不读 /etc/hosts），host.docker.internal 解析不了，
# 故直接用 workflow-net 网关 IP（= 宿主在 docker 网络上的地址，docker network inspect 可查）。
worker_processes 1;

events {
    worker_connections 256;
}

http {
    # 上游：宿主 pi-web:30141。⚠️ 不要硬编码 workflow-net 网关 IP——`docker compose down`
    # 会重建网络并换网关子网（历史值 172.22.0.1，2026-11-14 重建后变 172.18.0.1）。
    # host.docker.internal = host-gateway（compose extra_hosts 注入 /etc/hosts，解析当前网关）；
    # nginx resolver 不读 /etc/hosts，故用 dnsmasq :53 → systemd-resolved（它读 /etc/hosts）。
    resolver 172.17.0.11 valid=10s ipv6=off;

    upstream pi_web {
        zone pi_web 64k;
        server host.docker.internal:30141;
    }

    server {
        listen 8443 ssl;
        server_name xiaobai.asyou.me www.xiaobai.asyou.me;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://pi_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 长连接
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
