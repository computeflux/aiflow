# core-ui 前端静态托管（容器内 nginx，:5181 单容器单端口；
# 单入口 SPA：/ops/（运维中心）+ /product/（产品与任务）+ /content/（内容生产，原 :5182）
# + /email/（邮件，原 :5183）
# 五个板块由前端路由区分，见 apps/core-ui/src/main.tsx）
# 同源代理 /api/ /mailer/ /jaeger/ 消除跨域（S0）
# 上游地址与动态解析（zone + resolve，上游换 IP 不 502）见 upstreams.conf → conf.d/00-upstreams.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CORS：允许其他服务（如 合约控制台 8000 / 链上监控 8002）跨域读取 urls.json 等静态资源
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;

    # 预检请求直接返回 204（响应头由上方 server 级 add_header 统一附加）
    if ($request_method = OPTIONS) {
        return 204;
    }

    # 根路径 → /ops（运维中心，唯一登录枢纽 /ops/login）
    location = / {
        return 302 /ops/;
    }

    # 单入口 SPA：/ops /product /content /email 四个板块共用同一个 index.html，
    # 任意深路径回退 index.html 由前端路由（src/main.tsx）接管；
    # 根级 /urls.json 是 public/ 静态文件，由本 location 直接服务（CORS 头由 server 级 add_header 统一附加）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（单入口，assets/ 在 html 根）
    location ~ ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 自定义了 add_header，需同时补齐 CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        try_files $uri =404;
    }

    # 同源代理：workflow API（剥 /api 前缀 → workflow-api:8001）
    location /api/ {
        proxy_pass http://workflow_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # SSE（ai-flow 网关 /api/ai-flow/chat 与落卡接口共用本代理）：关闭响应缓冲，否则 token 会被 nginx 攒成整包再发，
        # 流式效果全没了（后端同时发 X-Accel-Buffering: no，双保险）。
        proxy_buffering off;
        proxy_cache off;
        # 本地大模型长 prompt / 长工具调用生成较慢，Go 侧已去掉硬超时（见 internal/llm/client.go），
        # 网关读超时同步放大，避免长生成被 nginx 先 504 截断。
        # 实测 board AI 流式单次 LLM 调用可达 16–17 分钟（> 900s），900s 会被 nginx 先截断，
        # 客户端 reader.read() 抛 "Error in input stream"；放大到 3600s 与 nginx-pi 一致留足余量。
        # 900s 是为了盖住文档拆解（后端 DECOMPOSE_TIMEOUT_SEC 默认 600s）：
        # 不等式 后端(600s) < nginx(900s) < 前端(950s)，出错时总是最内层先给出可读错误。
        proxy_read_timeout 3600s;
    }

    # 同源代理：ai-flow（PicoClaw gateway :8134）AI 对话后端（board AI 助手唯一后端）。
    # 剥 /api/ai-flow 前缀 → ai-flow gateway（/chat 对话流）；SSE 流式必须关缓冲（同 /api/ 说明）。
    # ai-flow 未部署时 upstream DNS 解析失败 → 502，前端展示后端不可用错误（无回退链路）。
    location /api/ai-flow/ {
        proxy_pass http://ai_flow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 同源代理：social 多渠道账号池 API（M1-4 账号管理页；剥 /social 前缀 → social:8010）。
    # social 的路径自带 /api/social/... 前缀（前端拼 /social + /api/social/...）。
    location /social/ {
        proxy_pass http://social_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 触发登录只建任务入队（秒级返回）；登录动作在 worker 侧执行，不占用本连接。
        proxy_read_timeout 60s;
    }
    # 同源代理：mailer API（剥 /mailer 前缀 → mailer:8003）
    location /mailer/ {
        proxy_pass http://mailer_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Jaeger UI（QUERY_BASE_PATH=/jaeger）同源反代，供链路追踪页使用
    location /jaeger/ {
        proxy_pass http://jaeger_ui/jaeger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
