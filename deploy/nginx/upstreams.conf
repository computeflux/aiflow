# board 反代上游定义（动态解析）。随镜像 COPY 为 /etc/nginx/conf.d/00-upstreams.conf，
# 文件名 00- 前缀保证先于 board.conf 加载（nginx 按字典序 include conf.d/*.conf）。
#
# 背景（2026-09-30 事故根因）：proxy_pass 里写容器名时，nginx 只在【启动时】解析一次，
# 上游容器重建/重启换 IP 后不重解析 → 全部 502（board /api/ 与 nginx-pi→pi-web 同病）。
# 修复：resolver 指向 Docker 内嵌 DNS（127.0.0.11）+ upstream 带 zone + `resolve` 参数，
# nginx 会在 TTL 过期后重新解析，上游换 IP 无需重启本容器。
# 依赖：nginx ≥ 1.27.3（upstream server resolve，官方版本支持）；当前镜像 stable-alpine = 1.30.x。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream workflow_api { zone workflow_api 64k; server workflow-api:8001 resolve; }
upstream mailer_api   { zone mailer_api   64k; server mailer:8003        resolve; }
upstream jaeger_ui    { zone jaeger_ui    64k; server jaeger:16686       resolve; }
# ai-flow（PicoClaw gateway，P3-2：core-ui /api/ai-flow/ → :8134）
upstream ai_flow       { zone ai_flow       64k; server ai-flow:8134        resolve; }
