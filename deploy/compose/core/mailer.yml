# Mailer（邮件发送；:8003 仅 127.0.0.1，board 经 /mailer/ 同源代理）
# 复用 apps/mailer 既有 Dockerfile（独立 Go 模块）
services:
  mailer:
    build:
      context: ../../../apps/mailer
      dockerfile: Dockerfile
    image: workflow-mailer:latest
    container_name: mailer
    restart: always
    env_file: ../../../.env
    environment:
      MAILER_PORT: "8003"
    ports:
      - "127.0.0.1:8003:8003"
    networks: [workflow-net]
    volumes:
      - ../../../.env:/app/.env:ro
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    labels: ["part-of=compute-flux-workflow"]
