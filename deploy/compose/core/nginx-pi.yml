# nginx-pi（pi-web TLS 终结）：宿主 :8443 HTTPS → 宿主 pi-web:30141（HTTP + Basic Auth 纵深防御）
# 证书：Let's Encrypt（sslmon 签发），bind mount 自仓库 cache/ssl/xiaobai/；
# 续签后替换 cache/ssl/xiaobai/{fullchain,privkey}.pem 即可，无需改配置。
# 访问域名：https://xiaobai.asyou.me:8443/；IP 直连会证书不匹配警告。
# pi-web 跑在宿主（systemd 用户单元 pi-web.service），容器经 host.docker.internal:30141 访问。
services:
  nginx-pi:
    image: nginx:1.27-alpine
    container_name: nginx-pi
    restart: always
    # 仅取 PI_WEB_PASSWORD 供 healthcheck 用（pi-web 的 Basic Auth 用户名固定 pi）
    env_file: ../../../apps/core/agents/pi/config/env
    ports:
      - "8443:8443"
    # pi-web 跑在宿主（systemd 用户单元），容器经 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [workflow-net]
    volumes:
      - ../../config/nginx-pi/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt 证书（sslmon 签发，ro）
      - ../../../cache/ssl/xiaobai/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ../../../cache/ssl/xiaobai/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    # 自签证书不校验（--no-check-certificate）；pi-web 带 Basic Auth，无凭据 401 会被判失败，
    # 故用 PI_WEB_PASSWORD 拼 Authorization 头（用户名固定 pi）。
    # 注意：compose 会插值 $ 变量，要透传给容器 shell 必须写 $$
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate --header \"Authorization: Basic $(echo -n \"pi:$$PI_WEB_PASSWORD\" | base64)\" https://127.0.0.1:8443/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    labels: ["part-of=compute-flux-workflow"]
