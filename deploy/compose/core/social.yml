# social — 小红书 MCP server（apps/social 源码构建；MCP Streamable HTTP + REST API）
# 登录态（cookies.json / 指纹 seed）持久化在 ./data 卷；Chromium 已内置于镜像。
# 端口 18060 仅 workflow-net 内部（不发布到宿主，与 8001/8003 等一致的最小暴露策略）。
#
# douyin-mcp — 抖音 MCP server（liaogx/douyin-mcp 源码，独立二进制 ./douyin-mcp，Dockerfile target=douyin-mcp）
# 登录态目录持久化在 ./douyin-data 卷（浏览器 profile / cookies / api-token）；端口 18061 仅 workflow-net 内部（避开小红书 18060 与 ali-mcp 18070）。
services:
  social:
    image: social:latest
    build:
      context: ../../../apps/social
      dockerfile: Dockerfile
      # 显式钉 target：Dockerfile 末尾还有 douyin-mcp 阶段，不指定时默认构建
      # 最后一个阶段，会产出抖音镜像（错端口 18061 + 无 Chromium 运行库）。
      target: social
    container_name: social
    restart: always
    environment:
      # 鉴权 Bearer Token（main.go 强制要求，空则拒绝启动）。
      # 用 :? 强制显式配置，无弱默认值——避免容器以公开可知的 token 启动。
      # 插值来源是 deploy/.env（compose 层变量，见 deploy/README.md），不是仓库根 .env。
      AUTH_TOKEN: ${SOCIAL_AUTH_TOKEN:?SOCIAL_AUTH_TOKEN 未配置（在 deploy/.env 设置，见 deploy/.env.example）}
      # 登录态落持久卷（COOKIES_PATH 优先级最高，见 cookies.GetCookiesFilePath）
      COOKIES_PATH: /app/data/cookies.json
    networks: [workflow-net]
    volumes:
      - ../../../apps/social/data:/app/data
    # /health 无鉴权（routes.go，GET-only）；trixie-slim 自带 wget（不用 --spider：它发 HEAD，路由只注册了 GET）
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18060/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    labels: ["part-of=compute-flux-workflow"]

  # douyin-mcp — 抖音 MCP server（liaogx/douyin-mcp 源码，独立二进制；独立端口 18061）
  # 17 个 MCP 工具（登录/发布/搜索/互动）；浏览器走系统 chromium（镜像 apt 安装）。
  douyin-mcp:
    image: douyin-mcp:latest
    build:
      context: ../../../apps/social
      dockerfile: Dockerfile
      target: douyin-mcp
    container_name: douyin-mcp
    restart: always
    environment:
      # 鉴权 Bearer Token（douyin-mcp 读 DY_AUTH_TOKEN，要求 ≥32 字符，空则用 data/api-token 文件）。
      # 独立于 SOCIAL_AUTH_TOKEN：两服务登录态/账号体系独立，token 不混用。
      # 插值来源是 deploy/.env（compose 层变量，见 deploy/README.md），不是仓库根 .env。
      DY_AUTH_TOKEN: ${DOUYIN_AUTH_TOKEN:?DOUYIN_AUTH_TOKEN 未配置（在 deploy/.env 设置，见 deploy/.env.example）}
      # 登录态落持久卷（浏览器 profile / cookies / api-token / 回执）；素材目录限定可上传范围。
      DY_DATA_DIR: /app/douyin-data
      DY_MEDIA_ROOT: /app/douyin-media
    networks: [workflow-net]
    volumes:
      - ../../../apps/social/douyin-data:/app/douyin-data
      - ../../../apps/social/douyin-media:/app/douyin-media
    # /health 无鉴权（routes.go，GET-only）；镜像自带 wget（不用 --spider：它发 HEAD，路由只注册了 GET）
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18061/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    labels: ["part-of=compute-flux-workflow"]