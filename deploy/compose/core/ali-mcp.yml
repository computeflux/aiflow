# ali-mcp — 淘宝/闲鱼 MCP server（apps/social/ali-mcp 源码构建，独立 Go module）
# 登录态（taobao.json / xianyu.json）持久化在 ./ali-mcp-data 卷（ALI_COOKIES_DIR=/app/data）；
# Chromium 由 go-rod 管理，构建期已预下载进镜像（/root/.cache/rod/browser）。
# 端口 18070 仅 workflow-net 内部（不发布到宿主，与 social 18060 一致的最小暴露策略）。
# 本文件自含 workflow-net 声明，可独立 `docker compose -f compose/core/ali-mcp.yml up -d`
#（与根 docker-compose.yml 的 workflow-net 同名同 driver，聚合 include 时合并无冲突）。
services:
  ali-mcp:
    image: ali-mcp:latest
    build:
      context: ../../../apps/social
      dockerfile: Dockerfile.ali-mcp
    container_name: ali-mcp
    restart: always
    environment:
      # 鉴权 Bearer Token（main.go 强制要求，空则拒绝启动）。
      # 用 :? 强制显式配置，无弱默认值——避免容器以公开可知的 token 启动。
      # 插值来源是 deploy/.env（compose 层变量，见 deploy/README.md），不是仓库根 .env。
      ALI_MCP_AUTH_TOKEN: ${ALI_MCP_AUTH_TOKEN:?ALI_MCP_AUTH_TOKEN 未配置（在 deploy/.env 设置，见 deploy/.env.example）}
      # 登录态落持久卷（cookies.CookieDir 优先读 ALI_COOKIES_DIR）
      ALI_COOKIES_DIR: /app/data
      # 容器无 X server，默认 headless；电商风控对 headless 更严，
      # 需要时可在 deploy/.env 设 ALI_MCP_HEADLESS=false 覆盖（需镜像内有 X，当前不满足，仅留开关）。
      ALI_MCP_HEADLESS: ${ALI_MCP_HEADLESS:-true}
      # 可选代理（形如 http://user:pass@host:port），空则不启用
      ALI_PROXY: ${ALI_PROXY:-}
    networks: [workflow-net]
    volumes:
      - ../../../apps/social/ali-mcp-data:/app/data
    # /health 无鉴权（routes.go，GET-only）；trixie-slim 自带 wget（不用 --spider：它发 HEAD，路由只注册了 GET）
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18070/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    labels: ["part-of=compute-flux-workflow"]

# 单一网络：与根 docker-compose.yml 的 workflow-net 同名（bridge），容器名 DNS 互通
networks:
  workflow-net:
    driver: bridge
    name: workflow-net
