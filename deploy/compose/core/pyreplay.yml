# PyReplay（X 点赞/执行 worker；Temporal activity + 后台 like_jobs 执行器）
# 同时提供 like 技能 HTTP 端点 :9500（skill registry 中 addr=pyreplay:9500，仅内部网络；
# 127.0.0.1:9500 保留给宿主工具）
services:
  pyreplay:
    image: pyreplay:latest
    build:
      context: ../../../apps/pyreplay
      dockerfile: Dockerfile
    container_name: pyreplay
    restart: always
    env_file: ../../../apps/pyreplay/.env
    environment:
      TEMPORAL_HOST_PORT: temporal:7233
      MYSQL_HOST: workflow-mysql
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pyreplay
      # M1-4 登录任务消费（login_worker.py）：与 social 侧 store.OpenQueue 同口径
      # （REDIS_ADDR 默认 redis:6379，全系统 workflow-net 内部服务发现）。
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # 登录结果回报 social 账号池（board 账号管理页的数据源）；留空 = 回报整体跳过，
      # 登录链行为与 M1-3 一致。
      SOCIAL_LOGIN_REPORT_URL: ${SOCIAL_LOGIN_REPORT_URL:-http://social:8010}
    ports:
      - "127.0.0.1:9500:9500"
    networks: [workflow-net]
    volumes:
      - ../../../apps/pyreplay/config:/app/config:ro
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    # 健康检查必须探到 like 技能 HTTP 端点 :9500（skill_server.py 存活），
    # 而不是只查 PID 1——历史上 skill server 崩溃后容器仍显示 healthy，
    # 导致 like 技能长时间失联无人发现。slim 镜像无 curl，用 python 探活。
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request\ntry:\n    r = urllib.request.urlopen(\"http://127.0.0.1:9500/health\", timeout=3)\n    raise SystemExit(0 if r.status == 200 else 1)\nexcept Exception:\n    raise SystemExit(1)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    labels: ["part-of=compute-flux-workflow"]
