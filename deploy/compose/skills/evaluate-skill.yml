# Evaluate 技能（评估；:9502 仅内部网络，由 skillgateway HTTP 调用）
services:
  evaluate-skill:
    build:
      context: ../../../apps/core
      dockerfile: ../../deploy/Dockerfile.go
      args:
        target: evaluate-skill
    image: computeflux/evaluate-skill:latest
    container_name: evaluate-skill
    restart: always
    env_file: ../../../.env
    networks: [workflow-net]
    volumes:
      - ../../../.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hc", "port", "127.0.0.1:9502"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    labels: ["part-of=compute-flux-workflow"]
