# Search 技能（CRAG 向量检索；:9503 仅内部网络，由 skillgateway HTTP 调用）
services:
  search-skill:
    build:
      context: ../../../apps/core
      dockerfile: ../../deploy/Dockerfile.go
      args:
        target: search-skill
    image: computeflux/search-skill:latest
    container_name: search-skill
    restart: always
    env_file: ../../../.env
    networks: [workflow-net]
    volumes:
      - ../../../.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hc", "port", "127.0.0.1:9503"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    labels: ["part-of=compute-flux-workflow"]
