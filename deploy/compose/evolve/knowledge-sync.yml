# S7 产品情报（docs/plan/S7-产品情报.md §3.1）：
# 进程内 daily 02:00 ticker：扫描 KNOWLEDGE_INTERNAL_DIR（docs/ + apps/*/README.md + 会议纪要目录）
# → 按内容 hash diff 增量入库（清洗/分块/向量化 → Qdrant，带 source_type/confidentiality/doc_title/updated_at metadata）
# → 同步结果附注到当日 ops_reports（type=daily，仅追加不覆盖）。
# 只读仓库文件 + 只写 Qdrant / knowledge_docs / ops_reports 附注，不触碰运行链路
#（§7 回滚：docker compose stop knowledge-sync 即止，已入库数据保留）。
# 降级：LLM 嵌入不可用时跳过入库（不阻塞）。
# 仅内部网络（:8129 健康探针不发布宿主端口）。
services:
  knowledge-sync:
    build:
      context: ../../../apps/core
      dockerfile: ../../deploy/Dockerfile.go
      args:
        target: knowledge-sync
    image: computeflux/knowledge-sync:latest
    container_name: knowledge-sync
    restart: always
    env_file: ../../../.env
    networks: [workflow-net]
    volumes:
      - ../../../:/work:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hc", "port", "127.0.0.1:8129"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    labels: ["part-of=compute-flux-workflow"]
