# S4 协作底座审批 Bot（docs/plan/S4-协作底座.md §3.2 / §3.3）：
# 以 @approval-bot 身份长轮询 synapse /sync，监听 #approvals：
# `approve <id>` / `reject <id> [reason]` → workflow-api /approvals/:id/approve|reject
# → 回消息确认；审批决策在 api 侧留 audit_logs 并触发 CD（灰度/回滚/Signal）。
# 纯 stdlib（无 mautrix；计划 §3.3 允许的 /sync 轮询降级实现）。
# 仅内部网络（:8126 健康探针不发布宿主端口）；MATRIX_ENABLED=false 时通知为 no-op，
# 停本容器 + 停 synapse 即下线，无自动副作用（§7 回滚）。
services:
  matrix-bot:
    build:
      context: ../../../apps/core
      dockerfile: ../../deploy/Dockerfile.go
      args:
        target: matrix-bot
    image: computeflux/matrix-bot:latest
    container_name: matrix-bot
    restart: always
    env_file: ../../../.env
    networks: [workflow-net]
    depends_on:
      synapse:
        condition: service_healthy
      workflow-api:
        condition: service_started
    # 有 HTTP 端口（health 探针）：TCP 拨号探活（distroless 内 /bin/hc port）
    healthcheck:
      test: ["CMD", "/bin/hc", "port", "127.0.0.1:8126"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 0.25
    labels: ["part-of=compute-flux-workflow"]
