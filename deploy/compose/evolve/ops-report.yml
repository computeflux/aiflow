# S6 运维情报（docs/plan/S6-运维情报.md §3.1/§3.2）：
# 进程内 ticker：daily 08:00 出日报 + 每周一 08:00 出周报/升级建议。
# 聚合 error_logs / skill_runs / skill_circuit / interventions / Temporal（全部现有数据，不新增采集）
# → LLM 中文归纳（不可用降级为纯数据表）→ ops_reports 表（type=daily|weekly|upgrade_suggestion）。
# 只读现有数据 + 只写 ops_reports，不触碰任何运行链路（§6 回滚：docker compose stop ops-report 即止）。
# 镜像 deploy/Dockerfile.go（distroless）：git 不在镜像内 → git 变更热点降级为空，
# 但 TODO/FIXME 扫描（纯 Go 文件遍历）与全部 DB/Temporal 数据正常（仓库只读挂载 /work）。
# 仅内部网络（:8128 健康探针不发布宿主端口）。
services:
  ops-report:
    build:
      context: ../../../apps/core
      dockerfile: ../../deploy/Dockerfile.go
      args:
        target: ops-report
    image: computeflux/ops-report:latest
    container_name: ops-report
    restart: always
    env_file: ../../../.env
    networks: [workflow-net]
    volumes:
      - ../../../:/work:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hc", "port", "127.0.0.1:8128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    labels: ["part-of=compute-flux-workflow"]
