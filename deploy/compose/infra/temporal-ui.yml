# Temporal Web UI（:8233 仅 127.0.0.1，最小化暴露）
services:
  temporal-ui:
    image: temporalio/ui:2.51.1
    container_name: temporal-ui
    restart: always
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,https://dev-workflow.computeflux.ai
    depends_on:
      - temporal
    networks: [workflow-net]
    # 镜像内无 curl/wget/node，用 PID 1 存活检查做 liveness
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    labels: ["part-of=compute-flux-workflow"]
