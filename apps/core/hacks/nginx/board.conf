# board 前端静态托管（nginx 用户模式，systemd --user 运行）
# 由 workflow-board.service 通过 -c 指定本配置启动

worker_processes 1;
pid /home/wetee/.cache/board-nginx/nginx.pid;
error_log /home/wetee/.cache/board-nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/wetee/.cache/board-nginx/access.log;

    # 用户模式下 nginx 无法写 /var/cache，全部指向用户目录
    client_body_temp_path /home/wetee/.cache/board-nginx/client_body;
    proxy_temp_path       /home/wetee/.cache/board-nginx/proxy;
    fastcgi_temp_path     /home/wetee/.cache/board-nginx/fastcgi;
    uwsgi_temp_path       /home/wetee/.cache/board-nginx/uwsgi;
    scgi_temp_path        /home/wetee/.cache/board-nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 5173;
        server_name _;

        root /home/wetee/work/cathome/workflow/apps/board/dist;
        index index.html;

        # CORS：允许其他服务（如 合约控制台 8000 / 链上监控 8002）跨域读取 urls.json 等静态资源
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;

        # 预检请求直接返回 204（响应头由上方 server 级 add_header 统一附加）
        if ($request_method = OPTIONS) {
            return 204;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            # /assets/ 自定义了 add_header，需同时补齐 CORS 头
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            try_files $uri =404;
        }

        # Jaeger UI（QUERY_BASE_PATH=/jaeger）同源反代，供链路追踪页使用
        location /jaeger/ {
            proxy_pass http://127.0.0.1:16686/jaeger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # 前端页面 404 回退到 SPA
        error_page 404 /index.html;
    }
}
