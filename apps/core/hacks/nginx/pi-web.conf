# pi-web HTTPS 终止（nginx 用户模式，systemd --user 运行）
# 由 workflow-pi-web-nginx.service 通过 -c 指定本配置启动
# 监听 443，使用 token 节点的 DigiCert 证书，反代本地 pi-web（30141）
# 访问域名：xiaobai.asyou.me（证书 CN/SAN）

worker_processes 1;
pid /home/wetee/.cache/pi-web-nginx/nginx.pid;
error_log /home/wetee/.cache/pi-web-nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/wetee/.cache/pi-web-nginx/access.log;

    # 用户模式下 nginx 无法写 /var/cache，全部指向用户目录
    client_body_temp_path /home/wetee/.cache/pi-web-nginx/client_body;
    proxy_temp_path       /home/wetee/.cache/pi-web-nginx/proxy;
    fastcgi_temp_path     /home/wetee/.cache/pi-web-nginx/fastcgi;
    uwsgi_temp_path       /home/wetee/.cache/pi-web-nginx/uwsgi;
    scgi_temp_path        /home/wetee/.cache/pi-web-nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8443 ssl;
        server_name xiaobai.asyou.me www.xiaobai.asyou.me;

        # token 节点证书（DigiCert DV，有效期见 openssl x509 -ser.pem）
        ssl_certificate     /srv/token_node0/token_chain_data/ssl/ser.pem;
        ssl_certificate_key /srv/token_node0/token_chain_data/ssl/ser.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # SSE（pi-web 用事件流，非 WebSocket），透传标准反代头即可
        location / {
            proxy_pass http://127.0.0.1:30141;
            proxy_http_version 1.1;
            # 用 $http_host 保留客户端原始 Host（含 :8443 端口）。pi-web 的
            # isProxyRewrittenSameOrigin 用 normalizeAuthority(保留端口) 比较
            # Origin authority 与 Host；$host 会去掉端口导致端口不匹配 -> 403。
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
